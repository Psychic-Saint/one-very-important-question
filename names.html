<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Eddie Bila">
<title>Who Said Yes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;600;800&display=swap">
<style>
  :root{--space:#00141d; --panel:#06283a; --cyan:#22d3ee; --pink:#ff4f93; --butter:#ffd84d; --mint:#5ef0b0; --text:#e8fbff; --muted:#8fb3c0; --line:rgba(34,211,238,.25)}
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; background:radial-gradient(60% 50% at 20% 0%, rgba(255,79,147,.18), transparent), radial-gradient(60% 50% at 90% 10%, rgba(34,211,238,.16), transparent), var(--space); color:var(--text); font:16px/1.4 "Outfit","Segoe UI",system-ui,sans-serif; padding:32px 16px}
  main{max-width:900px; margin:0 auto}
  h1{font:400 clamp(34px,7vw,54px)/1 "Bagel Fat One","Arial Rounded MT Bold",sans-serif; margin:0 0 6px}
  h1 span{background:linear-gradient(90deg,var(--pink),var(--butter),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .lede{color:var(--muted); margin:0 0 24px}
  form{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px}
  input{flex:1 1 220px; font:600 16px inherit; font-family:inherit; color:var(--text); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  button{font:400 18px "Bagel Fat One",sans-serif; border:0; border-radius:999px; padding:12px 26px; background:linear-gradient(135deg,var(--mint),var(--cyan)); color:var(--space); cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px dashed var(--butter); outline-offset:3px}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px}
  .tile b{display:block; font:400 34px/1 "Bagel Fat One",sans-serif; color:var(--butter); font-variant-numeric:tabular-nums}
  .tile span{font:800 11px/1 inherit; font-family:inherit; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .wrap{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:rgba(6,40,58,.7)}
  table{width:100%; border-collapse:collapse; min-width:640px}
  th,td{text-align:left; padding:12px 14px; border-bottom:1px solid rgba(34,211,238,.12)}
  th{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); font-weight:800}
  td.name{font-weight:600}
  td.num{font-variant-numeric:tabular-nums}
  .msg{color:var(--butter); min-height:1.4em}
  footer{margin-top:28px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(143,179,192,.6); text-align:center}
</style>
</head>
<body>
<main>
  <h1>Who said <span>yes</span></h1>
  <p class="lede">Everyone who locked in a date and signed their ticket. Private to you: it needs your passcode.</p>
  <form id="f">
    <input id="code" type="password" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode">
    <button type="submit">Show names</button>
  </form>
  <p class="msg" id="msg"></p>
  <section id="out" hidden>
    <div class="tiles">
      <div class="tile"><b id="total">0</b><span>Yeses</span></div>
      <div class="tile"><b id="today">0</b><span>Today</span></div>
      <div class="tile"><b id="avgNo">0</b><span>Avg. No attempts</span></div>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>Name</th><th>Date picked</th><th>Time</th><th>Vibe</th><th>No attempts</th><th>Signed</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <footer>Designed and Developed by: Eddie Bila</footer>
</main>
<script>
  const SB_URL = 'https://sdvcetthmsqcaojjtkjw.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkdmNldHRobXNxY2Fvamp0a2p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MzUwMjEsImV4cCI6MjEwNTMxMTAyMX0.BUXpuMC9HWAs75Lw9wWzE6m7X023HKQy-llD57R_BEE';
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = s => document.querySelector(s);
  async function load(code){
    $('#msg').textContent = 'Loading…';
    try {
      const r = await fetch(SB_URL + '/rest/v1/rpc/get_rsvps', {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json'}, body:JSON.stringify({passcode:code})});
      if (!r.ok){ $('#msg').textContent = 'That passcode is wrong.'; $('#out').hidden = true; return; }
      const rows = await r.json();
      const todayStr = new Date().toDateString();
      $('#total').textContent = rows.length;
      $('#today').textContent = rows.filter(x => new Date(x.created_at).toDateString() === todayStr).length;
      $('#avgNo').textContent = rows.length ? (rows.reduce((a,x) => a + (x.no_attempts||0), 0) / rows.length).toFixed(1) : '0';
      $('#rows').innerHTML = rows.length ? rows.map(x => `<tr>
        <td class="name">${esc(x.name)}</td>
        <td>${esc(new Date(x.date_picked + 'T00:00').toLocaleDateString('en-ZA',{weekday:'short', day:'numeric', month:'short'}))}</td>
        <td>${esc(x.time_picked)}</td><td>${esc(x.vibe)}</td><td class="num">${esc(x.no_attempts)}</td>
        <td>${esc(new Date(x.created_at).toLocaleString('en-ZA',{day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}))}</td></tr>`).join('')
        : '<tr><td colspan="6">Nobody yet. Give it time.</td></tr>';
      $('#out').hidden = false; $('#msg').textContent = '';
    } catch { $('#msg').textContent = "Couldn't reach the database. Check your connection and try again."; }
  }
  $('#f').addEventListener('submit', e => { e.preventDefault(); const c = $('#code').value.trim(); if (c) load(c); });
  const fromHash = decodeURIComponent(location.hash.slice(1));
  if (fromHash){ $('#code').value = fromHash; load(fromHash); }
</script>
</body>
</html>
