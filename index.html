<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Very Important Question</title>
<meta name="author" content="Eddie Bila">
<meta name="creator" content="Eddie Bila">
<meta name="description" content="A very important question. There is only one right answer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&family=Outfit:wght@400;600;800&display=swap">
<style>
  :root{
    --space:#00141d; --space-2:#04202d; --panel:#06283a; --panel-2:#0a3348;
    --cyan:#22d3ee; --cyan-soft:#8ae9f7; --pink:#ff4f93; --blush:#ff9ab8;
    --butter:#ffd84d; --mint:#5ef0b0; --violet:#a78bfa; --gold:#d4af37;
    --text:#e8fbff; --muted:#8fb3c0; --line:rgba(34,211,238,.28);
    --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    --hand:"Gaegu","Comic Sans MS","Chalkboard SE",cursive;
    --ui:"Outfit","Segoe UI",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{min-height:100%}
  body{
    margin:0; background:var(--space); color:var(--text);
    font-family:var(--ui); font-size:17px; overflow-x:hidden;
  }
  canvas#world{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:0; transition:opacity 1.2s ease}
  canvas#world.on{opacity:1}
  canvas#sky{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
  .aurora{
    position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(70px); opacity:.55;
    background:
      radial-gradient(28% 24% at 18% 22%, rgba(255,79,147,.45), transparent 70%),
      radial-gradient(30% 26% at 82% 18%, rgba(34,211,238,.40), transparent 70%),
      radial-gradient(26% 24% at 70% 86%, rgba(167,139,250,.38), transparent 70%),
      radial-gradient(22% 20% at 20% 84%, rgba(94,240,176,.25), transparent 70%);
    animation:drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{to{transform:translate3d(3%,-2%,0) rotate(4deg)}}

  .stage{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding-inline:16px; padding-block:40px 20px}
  .card{
    position:relative; width:100%; max-width:600px; text-align:center;
    background:linear-gradient(160deg, rgba(10,51,72,.92), rgba(4,32,45,.94));
    border:1px solid var(--line); border-radius:30px; padding:34px 26px 30px;
    box-shadow:0 0 0 1px rgba(34,211,238,.08), 0 30px 80px -20px rgba(0,0,0,.7), 0 0 60px -10px rgba(34,211,238,.35);
    backdrop-filter:blur(8px); transform-style:preserve-3d; transition:transform .2s ease-out;
    animation:arrive .9s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes arrive{from{opacity:0; transform:translateY(40px) scale(.94) rotateX(12deg)}}
  .card::before{
    content:""; position:absolute; inset:-1px; border-radius:inherit; padding:2px; pointer-events:none;
    background:conic-gradient(from var(--spin,0deg), var(--cyan), var(--pink), var(--butter), var(--mint), var(--violet), var(--cyan));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.85; animation:spin 6s linear infinite;
  }
  @property --spin{syntax:"<angle>"; initial-value:0deg; inherits:false}
  @keyframes spin{to{--spin:360deg}}

  .stamp{
    position:absolute; top:-16px; right:20px; transform:rotate(6deg);
    background:var(--butter); color:var(--space); border-radius:10px;
    padding:4px 14px; font:800 13px/1.2 var(--ui); letter-spacing:.14em; text-transform:uppercase;
    box-shadow:0 6px 18px -4px rgba(255,216,77,.6);
  }
  .from{margin:0; font:400 21px/1.2 var(--hand); color:var(--cyan-soft)}
  h1{font-family:var(--display); font-weight:400; font-size:clamp(38px,9vw,62px); line-height:1.02; margin:8px 0 6px; text-wrap:balance; letter-spacing:.01em}
  h1 .pop{background:linear-gradient(90deg,var(--pink),var(--butter),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .sub{margin:0 auto 4px; max-width:34ch; font:400 23px/1.25 var(--hand); color:var(--text)}
  .face3d{width:196px; height:293px; margin:10px auto 8px; perspective:800px; position:relative}
  .face3d::after{content:""; position:absolute; left:14%; right:14%; bottom:-16px; height:18px; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.6), transparent); filter:blur(2px); animation:shadowpulse 3.2s ease-in-out infinite}
  @keyframes shadowpulse{50%{transform:scaleX(.82); opacity:.7}}
  .face-disc{--rx:0deg; --ry:0deg; --gx:35%; --gy:25%; position:relative; width:100%; height:100%;
    transform:rotateX(var(--rx)) rotateY(var(--ry)); transform-style:preserve-3d; transition:transform .18s ease-out, filter .4s}
  .face-disc .halo{position:absolute; left:50%; top:46%; width:150%; aspect-ratio:1; transform:translate(-50%,-50%) translateZ(-40px); border-radius:50%; pointer-events:none;
    background:radial-gradient(closest-side, rgba(34,211,238,.35), rgba(255,79,147,.18) 55%, transparent 72%)}
  .face-disc .halo::before{content:""; position:absolute; inset:14%; border-radius:50%; padding:3px;
    background:conic-gradient(from var(--spin,0deg), var(--cyan), var(--pink), var(--butter), var(--mint), var(--violet), var(--cyan));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    filter:blur(1px) drop-shadow(0 0 8px rgba(34,211,238,.8)); animation:spin 5s linear infinite; opacity:.9}
  .face-inner{position:absolute; inset:0}
  .face-move{position:absolute; inset:0; transform-origin:50% 88%; animation:headbob 3.2s ease-in-out infinite; filter:drop-shadow(0 12px 18px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,79,147,.35))}
  @keyframes headbob{
    0%,100%{transform:translateY(0) rotate(-4deg) rotateY(-8deg)}
    25%{transform:translateY(-6px) rotate(0deg) rotateY(0deg) scale(1.02)}
    50%{transform:translateY(0) rotate(4deg) rotateY(8deg)}
    75%{transform:translateY(-6px) rotate(0deg) rotateY(0deg) scale(1.02)}}
  .face-disc img{display:block; width:100%; height:100%; object-fit:contain}
  .geye{position:absolute; top:58.8%; width:25%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 38% 30%, #fff 55%, #dfe9ec); box-shadow:0 0 0 3px #1a0e0a, 0 3px 6px rgba(0,0,0,.35); transition:opacity .3s}
  .geye.l{left:31.8%} .geye.r{left:72%}
  .geye .pupil{position:absolute; left:50%; top:50%; width:50%; height:50%; margin:-25% 0 0 -25%; border-radius:50%;
    background:radial-gradient(circle at 34% 32%, #fff 0 13%, #2a160c 15% 58%, #0b0503 60%);
    transform:translate(var(--px,0px), var(--py,0px)); transition:transform .12s ease-out}
  .geye .lid{position:absolute; inset:-2px; background:linear-gradient(#974626, #b86332); box-shadow:inset 0 -3px 0 #1a0e0a; transform:translateY(-102%); animation:blink 5s infinite}
  @keyframes blink{0%,92%,100%{transform:translateY(-102%)} 95%{transform:translateY(0)}}
  .face-disc.roll .pupil{animation:eyeroll .9s ease-in-out}
  @keyframes eyeroll{0%{transform:translate(0,0)} 15%{transform:translate(-6px,5px)} 35%{transform:translate(-8px,-4px)} 55%{transform:translate(0,-9px)} 75%{transform:translate(8px,-4px)} 90%{transform:translate(6px,4px)} 100%{transform:translate(0,0)}}
  .face-disc .lh{position:absolute; width:27%; transform:translate(-50%,-50%) scale(0); transition:transform .45s cubic-bezier(.3,1.8,.5,1); filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .face-disc .lh.l{left:32.4%; top:52.9%} .face-disc .lh.r{left:67.9%; top:57.1%}
  .face-disc.love .lh{transform:translate(-50%,-50%) scale(1); animation:beat 1s ease-in-out infinite .5s}
  @keyframes beat{50%{transform:translate(-50%,-50%) scale(1.18)}}
  .face-disc.love .geye{opacity:0}
  .face-disc .tear{position:absolute; left:27%; top:58%; width:10%; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4)); animation:drip 1.4s ease-in infinite}
  @keyframes drip{0%{transform:translateY(0); opacity:0} 20%{opacity:1} 100%{transform:translateY(30px); opacity:0}}
  .face-disc .shine{display:none}
  /* whole-head moves */
  .face-disc.shake .face-move{animation:headshake .6s ease-in-out}
  @keyframes headshake{0%,100%{transform:rotateY(0) translateX(0)} 15%{transform:rotateY(-28deg) translateX(-10px) rotate(-6deg)} 35%{transform:rotateY(26deg) translateX(10px) rotate(6deg)} 55%{transform:rotateY(-20deg) translateX(-7px) rotate(-4deg)} 75%{transform:rotateY(14deg) translateX(5px) rotate(3deg)}}
  .face-disc.nod .face-move{animation:headnod .7s ease-in-out}
  @keyframes headnod{0%,100%{transform:rotateX(0) translateY(0)} 25%{transform:rotateX(24deg) translateY(6px)} 50%{transform:rotateX(-10deg) translateY(-4px)} 75%{transform:rotateX(18deg) translateY(4px)}}
  .face-disc.sad .face-move{animation:droop 2.6s ease-in-out infinite; filter:saturate(.6) brightness(.9) drop-shadow(0 12px 18px rgba(0,0,0,.55))}
  @keyframes droop{0%,100%{transform:rotate(10deg) translateY(8px)} 50%{transform:rotate(6deg) translateY(12px) scale(.98)}}
  .face-disc.love .face-move{animation:happy 1.1s cubic-bezier(.3,1.5,.5,1) infinite; transform-origin:50% 100%}
  @keyframes happy{0%,100%{transform:translateY(0) scale(1,1) rotate(-3deg)} 20%{transform:translateY(2px) scale(1.06,.94)} 50%{transform:translateY(-16px) scale(.97,1.04) rotate(3deg)} 80%{transform:translateY(1px) scale(1.04,.96)}}
  .face-disc.spin .face-move{animation:spinhead 1s cubic-bezier(.3,1.3,.5,1)}
  @keyframes spinhead{from{transform:rotateY(0)} to{transform:rotateY(360deg)}}
  .face-disc.sad.shake .face-move{animation:headshake .6s ease-in-out}
  .face-disc .eyes{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
  .eyes .pupil{transform:translate(var(--px,0px), var(--py,0px)); transition:transform .14s ease-out}
  .eyes .lid{transform:translateY(-130px); animation:blink2 4.6s infinite}
  @keyframes blink2{0%,90%,100%{transform:translateY(-130px)} 93%,94%{transform:translateY(0)} 97%{transform:translateY(-130px)} 98.5%{transform:translateY(0)}}
  .face-disc.roll .eyes .pupil{animation:eyeroll2 .9s ease-in-out}
  @keyframes eyeroll2{0%{transform:translate(0,0)} 15%{transform:translate(-26px,8px)} 35%{transform:translate(-30px,-8px)} 55%{transform:translate(0,-14px)} 75%{transform:translate(30px,-8px)} 90%{transform:translate(26px,8px)} 100%{transform:translate(0,0)}}
  .face-disc.sad .eyes .lid{animation:none; transform:translateY(-95px)}
  .face-disc.love .eyes{opacity:0; transition:opacity .3s}
  .face3d.wobble{transform-origin:50% 90%}
  .taunt{min-height:1.4em; margin:8px 0 16px; font:700 25px/1.2 var(--hand); color:var(--butter)}
  .buttons{display:flex; gap:20px; justify-content:center; align-items:center; flex-wrap:wrap; min-height:86px}

  button,.btn{
    font-family:var(--display); font-size:26px; letter-spacing:.02em; cursor:pointer; text-decoration:none;
    border:0; border-radius:999px; padding:14px 38px; color:var(--space);
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none;
    transition:transform .15s, box-shadow .2s, opacity .2s;
  }
  button:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px dashed var(--butter); outline-offset:4px}
  #yes{
    background:linear-gradient(135deg,var(--mint),var(--cyan)); transform-origin:center;
    box-shadow:0 0 0 4px rgba(34,211,238,.18), 0 10px 30px -6px rgba(34,211,238,.8);
    transition:transform .3s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
  }
  #yes:hover{box-shadow:0 0 0 7px rgba(34,211,238,.25), 0 14px 40px -6px rgba(34,211,238,1)}
  #no{background:transparent; color:var(--pink); border:2px solid var(--pink); z-index:40; white-space:nowrap; box-shadow:0 0 22px -6px rgba(255,79,147,.8)}
  #no.loose{position:fixed; background:var(--space); transition:left .28s cubic-bezier(.2,1.4,.4,1), top .28s cubic-bezier(.2,1.4,.4,1), transform .2s}
  .count{margin:18px 0 0; font-size:14px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-variant-numeric:tabular-nums}

  /* planner */
  .step{margin-top:22px; text-align:left}
  .step h2{font:800 13px/1 var(--ui); letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); margin:0 0 10px; display:flex; align-items:center; gap:10px}
  .step h2::after{content:""; flex:1; height:1px; background:var(--line)}
  .days{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 12px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--cyan) transparent}
  .chip{
    flex:0 0 auto; scroll-snap-align:start; cursor:pointer; color:var(--text);
    background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:16px;
    font-family:var(--ui); font-size:15px; font-weight:600; letter-spacing:0; padding:10px 14px;
    box-shadow:none; transition:transform .15s, background .2s, border-color .2s, color .2s;
  }
  .chip:hover{transform:translateY(-2px); border-color:var(--cyan)}
  .chip[aria-pressed="true"]{background:var(--c,var(--cyan)); border-color:transparent; color:var(--space); box-shadow:0 8px 22px -8px var(--c,var(--cyan))}
  .day{width:74px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 6px}
  .day .dow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.8}
  .day .dnum{font:400 28px/1 var(--display)}
  .day .mon{font-size:12px; opacity:.8}
  .grid{display:flex; flex-wrap:wrap; gap:10px}
  .grid .chip small{display:block; font-weight:400; font-size:12px; opacity:.8}
  .custom{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; color:var(--muted); font-size:15px}
  .custom input{
    font:600 15px var(--ui); color:var(--text); color-scheme:dark;
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:9px 12px;
  }
  .lock{display:block; width:100%; margin-top:24px}
  .lock-btn{width:100%; background:linear-gradient(90deg,var(--pink),var(--butter)); box-shadow:0 12px 34px -10px rgba(255,79,147,.9)}
  .lock-btn[aria-disabled="true"]{opacity:.55}
  .hint{min-height:1.3em; margin:10px 0 0; text-align:center; font:700 21px/1.2 var(--hand); color:var(--butter)}

  /* ticket */
  .ticket{margin:20px 0 6px; border-radius:22px; overflow:hidden; text-align:left; background:#f7fdff; color:var(--space); box-shadow:0 20px 50px -18px rgba(34,211,238,.7)}
  .ticket .top{background:linear-gradient(120deg,var(--pink),var(--violet) 55%,var(--cyan)); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px}
  .ticket .top b{font:400 26px/1 var(--display); white-space:nowrap; letter-spacing:.03em}
  .ticket .top span{font:800 12px/1 var(--ui); letter-spacing:.2em; text-transform:uppercase; opacity:.9}
  .ticket .body{padding:18px 20px 8px; display:grid; grid-template-columns:1fr 1fr; gap:14px 18px}
  .ticket .body .wide{grid-column:1/-1}
  .ticket dt{font:800 11px/1 var(--ui); letter-spacing:.18em; text-transform:uppercase; color:#50707c; margin-bottom:4px}
  .ticket dd{margin:0; font:400 24px/1.1 var(--display)}
  .ticket .tear{border-top:2px dashed #b7d6df; margin:10px 20px 0; position:relative}
  .ticket .terms{padding:12px 20px 16px; font:400 19px/1.3 var(--hand)}
  .ticket .terms ol{margin:4px 0 0; padding-left:1.2em}
  .ticket .sig{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:0 20px 16px; font:600 13px var(--ui); color:#50707c}
  .actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:18px}
  .actions .btn{font-size:20px; padding:12px 24px}
  .wa{background:linear-gradient(135deg,var(--mint),#25d366)}
  .copy{background:linear-gradient(135deg,var(--butter),#ffb347)}
  .ghost{background:transparent; color:var(--cyan-soft); border:1px solid var(--line); font-family:var(--ui); font-weight:600; font-size:15px !important}

  canvas#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60}

  footer.credit{position:relative; z-index:1; font:400 12px/1.4 var(--ui); letter-spacing:.14em; text-transform:uppercase; color:rgba(143,179,192,.55); text-align:center; padding-inline:16px}
  footer.credit span{transition:color .3s}
  footer.credit span:hover{color:var(--gold)}
  footer.credit b{font-weight:600; color:rgba(232,251,255,.75)}

  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .wobble{animation:wobble .4s; transform-origin:75px 110px}
  .bouncy{animation:bounce .9s ease-in-out infinite}
  /* custom cursor */
  html.fancy-cursor, html.fancy-cursor *{cursor:none !important}
  .cur-dot,.cur-ring,.spark{position:fixed; left:0; top:0; pointer-events:none; z-index:9999}
  .cur-dot{width:18px; height:18px; margin:-9px 0 0 -9px; filter:drop-shadow(0 0 6px rgba(255,79,147,.9)); transition:transform .15s}
  .cur-dot svg{width:100%; height:100%; display:block}
  .cur-ring{width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; display:grid; place-items:center;
    transition:width .25s cubic-bezier(.3,1.5,.5,1), height .25s cubic-bezier(.3,1.5,.5,1), margin .25s cubic-bezier(.3,1.5,.5,1), background .25s}
  .cur-ring::before{content:""; position:absolute; inset:0; border-radius:50%; padding:2px;
    background:conic-gradient(from var(--spin,0deg), var(--cyan), var(--pink), var(--butter), var(--mint), var(--violet), var(--cyan));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    animation:spin 2.5s linear infinite; filter:drop-shadow(0 0 6px rgba(34,211,238,.7))}
  .cur-ring span{font:400 13px/1 var(--display); color:var(--butter); letter-spacing:.04em; opacity:0; transform:scale(.6); transition:opacity .2s, transform .25s; white-space:nowrap; text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .cur-ring.big{width:78px; height:78px; margin:-39px 0 0 -39px; background:rgba(255,79,147,.14)}
  .cur-ring.big span{opacity:1; transform:scale(1)}
  .cur-ring.press{width:30px; height:30px; margin:-15px 0 0 -15px}
  .spark{font-size:14px; line-height:1; will-change:transform,opacity; animation:sparkfloat .8s ease-out forwards}
  .spark svg{width:1em; height:1em; display:block}
  @keyframes sparkfloat{from{transform:translate(var(--x),var(--y)) scale(1) rotate(0); opacity:1} to{transform:translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(.2) rotate(var(--r)); opacity:0}}
  @media (max-width:480px){
    .card{padding:30px 18px 24px}
    button,.btn{font-size:22px; padding:12px 28px}
  }
  @media (prefers-reduced-motion:reduce){
    .eyes .lid,.face-disc.roll .eyes .pupil{animation:none}
    .face-move,.geye .lid,.face-disc.roll .pupil,.face-disc .face-move{animation:none!important}
    .aurora,.card,.card::before,.wobble,.bouncy{animation:none}
    #no.loose,#yes{transition:none}
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="world" aria-hidden="true"></canvas>

<main class="stage">
  <section class="card" id="card" aria-live="polite">
    <span class="stamp">Urgent</span>
    <p class="from">A message from Mister Warm &amp; Easy, who built this entire site for this</p>
    <h1>Will you go out <span class="pop">with me?</span></h1>
    <p class="sub">Think carefully. Or don't. I am literally not taking no for an answer.</p>

    <div class="face3d" id="blobBody" aria-hidden="true">
      <div class="face-disc" id="faceDisc">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
  /* Optional: put Eddie's WhatsApp number here in international format, e.g. '27821234567'.
     Left empty, the button opens WhatsApp so she can pick him from her chats. */
  const EDDIE_WHATSAPP = '27843232662';

  const $ = s => document.querySelector(s);
  const yes = $('#yes'), no = $('#no'), taunt = $('#taunt'), count = $('#count'), card = $('#card');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- starfield + floating hearts ---------- */
  const sky = $('#sky'), sctx = sky.getContext('2d');
  let W, H, mx = 0, my = 0;
  const palette = ['#22d3ee','#ff4f93','#ffd84d','#5ef0b0','#a78bfa'];
  const stars = [], floaters = [];
  function sizeSky(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; sky.width = W*dpr; sky.height = H*dpr; sctx.setTransform(dpr,0,0,dpr,0,0);
  }
  sizeSky(); addEventListener('resize', sizeSky);
  for (let i = 0; i < 160; i++) stars.push({x:Math.random(), y:Math.random(), z:Math.random()*0.9+0.1, t:Math.random()*6});
  for (let i = 0; i < 14; i++) floaters.push({x:Math.random(), y:Math.random(), z:Math.random()*0.8+0.2, s:Math.random()*10+8, c:palette[i%palette.length], v:Math.random()*0.00025+0.0001, r:Math.random()*6});
  function heart(ctx, x, y, s){ ctx.beginPath(); ctx.moveTo(x, y+s*0.35); ctx.bezierCurveTo(x-s, y-s*0.3, x-s*0.45, y-s, x, y-s*0.45); ctx.bezierCurveTo(x+s*0.45, y-s, x+s, y-s*0.3, x, y+s*0.35); ctx.fill(); }
  function drawSky(t){
    sctx.clearRect(0,0,W,H);
    stars.forEach(s => {
      const x = (s.x*W + mx*s.z*28 + W) % W, y = (s.y*H + my*s.z*28 + H) % H;
      sctx.globalAlpha = 0.35 + 0.45*Math.abs(Math.sin(t/1400 + s.t));
      sctx.fillStyle = s.z > 0.8 ? '#8ae9f7' : '#e8fbff';
      sctx.fillRect(x, y, s.z*1.8, s.z*1.8);
    });
    floaters.forEach(f => {
      if (!reduced) f.y -= f.v;
      if (f.y < -0.05) { f.y = 1.05; f.x = Math.random(); }
      sctx.globalAlpha = 0.22 + f.z*0.25; sctx.fillStyle = f.c;
      sctx.shadowColor = f.c; sctx.shadowBlur = 18;
      heart(sctx, f.x*W + mx*f.z*60, f.y*H + my*f.z*60 + Math.sin(t/900 + f.r)*6, f.s*f.z + 6);
      sctx.shadowBlur = 0;
    });
    sctx.globalAlpha = 1;
    if (!reduced) requestAnimationFrame(drawSky);
  }
  const world3D = startWorld();
  if (!world3D) requestAnimationFrame(drawSky);


  /* ---------- 3D world: glossy hearts drifting through a starfield ---------- */
  function startWorld(){
    if (!window.THREE) return false;
    const canvas = $('#world');
    let renderer;
    try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true}); } catch { return false; }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x00141d, 0.028);
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
    camera.position.set(0, 0, 18);
    const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); };
    resize(); addEventListener('resize', resize);

    scene.add(new THREE.AmbientLight(0x406070, 0.9));
    const key = new THREE.PointLight(0x22d3ee, 2.2, 80); key.position.set(10, 12, 16); scene.add(key);
    const rim = new THREE.PointLight(0xff4f93, 2.0, 80); rim.position.set(-14, -8, 10); scene.add(rim);
    const top = new THREE.DirectionalLight(0xffffff, 0.6); top.position.set(0, 10, 5); scene.add(top);

    // heart shape
    const hs = new THREE.Shape();
    hs.moveTo(0, -1.1);
    hs.bezierCurveTo(-0.2, -0.85, -1.6, 0.0, -1.6, 0.75);
    hs.bezierCurveTo(-1.6, 1.45, -0.9, 1.75, -0.45, 1.6);
    hs.bezierCurveTo(-0.15, 1.5, 0, 1.2, 0, 1.05);
    hs.bezierCurveTo(0, 1.2, 0.15, 1.5, 0.45, 1.6);
    hs.bezierCurveTo(0.9, 1.75, 1.6, 1.45, 1.6, 0.75);
    hs.bezierCurveTo(1.6, 0.0, 0.2, -0.85, 0, -1.1);
    const heartGeo = new THREE.ExtrudeGeometry(hs, {depth:0.55, bevelEnabled:true, bevelSegments:6, steps:1, bevelSize:0.28, bevelThickness:0.3, curveSegments:24});
    heartGeo.center();
    const ringGeo = new THREE.TorusGeometry(1, 0.28, 20, 60);
    const orbGeo = new THREE.IcosahedronGeometry(0.9, 2);

    const colors = [0xff4f93, 0x22d3ee, 0xffd84d, 0x5ef0b0, 0xa78bfa, 0xff9ab8];
    const things = [];
    const count = innerWidth < 600 ? 18 : 26;
    const spreadX = innerWidth < 600 ? 16 : 36;
    for (let i = 0; i < count; i++){
      const c = colors[i % colors.length];
      const kind = i % 5 === 3 ? 'ring' : (i % 7 === 5 ? 'orb' : 'heart');
      const mat = new THREE.MeshPhysicalMaterial({color:c, emissive:c, emissiveIntensity:0.18, roughness:0.22, metalness:0.1, clearcoat:1, clearcoatRoughness:0.15});
      const m = new THREE.Mesh(kind === 'ring' ? ringGeo : kind === 'orb' ? orbGeo : heartGeo, mat);
      const s = 0.45 + Math.random()*0.8;
      m.scale.setScalar(s);
      m.position.set((Math.random()-0.5)*spreadX, (Math.random()-0.5)*26, -Math.random()*26 - 3);
      m.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
      m.userData = {spin:(Math.random()-0.5)*0.012 + 0.004, rise:0.006 + Math.random()*0.012, bob:Math.random()*Math.PI*2};
      scene.add(m); things.push(m);
    }

    // star particles
    const starCount = 900, pos = new Float32Array(starCount*3), col = new Float32Array(starCount*3);
    const tint = [new THREE.Color(0xe8fbff), new THREE.Color(0x8ae9f7), new THREE.Color(0xff9ab8), new THREE.Color(0xffd84d)];
    for (let i = 0; i < starCount; i++){
      pos[i*3] = (Math.random()-0.5)*90; pos[i*3+1] = (Math.random()-0.5)*60; pos[i*3+2] = -Math.random()*70 + 10;
      const t = tint[Math.random() < 0.7 ? 0 : 1 + Math.floor(Math.random()*3)];
      col[i*3] = t.r; col[i*3+1] = t.g; col[i*3+2] = t.b;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      </div>
      <div class="actions"><button type="button" class="btn ghost" id="redo">Change the plan</button></div>`;
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    if (!reduced) { confetti(); window.__worldBurst && window.__worldBurst(); }
    scrollTo({top:0, behavior: reduced ? 'auto' : 'smooth'});
    $('#sendPdf').addEventListener('click', () => sendToEddie(false));
    $('#redo').addEventListener('click', () => { done = false; card.style.transform = ''; plan.date = plan.time = plan.timeLabel = plan.vibe = null; yes.click(); });
  }

  /* ---------- confetti ---------- */
  function confetti(){
    const c = $('#confetti'), ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
    c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const bits = Array.from({length:220}, () => ({
      x:innerWidth/2, y:innerHeight*0.4, vx:(Math.random()-0.5)*17, vy:Math.random()*-17-4,
      r:Math.random()*7+4, rot:Math.random()*6, vr:(Math.random()-0.5)*0.3,
      c:palette[Math.floor(Math.random()*palette.length)], h:Math.random() < 0.35
    }));
    const start = performance.now();
    (function tick(t){
      ctx.clearRect(0,0,innerWidth,innerHeight);
      bits.forEach(b => {
        b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c;
        if (b.h) heart(ctx, 0, 0, b.r*1.4); else ctx.fillRect(-b.r/2,-b.r/4,b.r,b.r/2);
        ctx.restore();
      });
      if (t - start < 5500) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
    })(start);
  }
})();
</script>
